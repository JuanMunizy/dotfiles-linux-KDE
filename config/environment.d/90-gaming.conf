# AMD RX 7600 + Ryzen 5600GT - Máximo Desempenho Gaming
# Usa a GPU dedicada (AMD Radeon RX 7600)

# Força Vulkan RADV (driver AMD open-source)
AMD_VULKAN_ICD=RADV
VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.i686.json:/usr/share/vulkan/icd.d/radeon_icd.x86_64.json

# Mesa shader cache - aumenta cache para reduzir stuttering
MESA_SHADER_CACHE_MAX_SIZE=10G

# Aceleração AMD
radeontop=1

# Força compositor offloading (se usar X11/KDE)
DRI_PRIME=1
VK_LAYEREnable=1

# Wine/Proton otimizações
DXVK_ASYNC=1
DXVK_HUD=0
STAGING_SHARED_MEMORY=1
MUTEX_SCHED_SPINCOUNT=0

# Wine sync (Futex2)
WINEFSYNC=1
WINEESYNC=1

# FSR em tela cheia (como o Heroic)
WINE_FULLSCREEN_FSR=1

# Steam - usa Proton Experimental por padrão
STEAM_COMPAT_DATA_PATH=/home/juan/.local/share/Steam/steamapps/compatdata
